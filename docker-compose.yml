x-app-version: &app_version "MVP 0.0.1"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diplom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diplom"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_VERSION: *app_version
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/diplom
      DB_SCHEMA: diplom_all
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ml:
    build:
      context: ./ml
    restart: unless-stopped
    environment:
      APP_VERSION: *app_version
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/diplom
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: *app_version
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
      ml:
        condition: service_healthy

volumes:
  postgres_data:
